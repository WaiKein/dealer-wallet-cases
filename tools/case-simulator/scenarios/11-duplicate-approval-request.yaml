name: Duplicate approval request
tags: [reliability, workflow]
actors:
  - id: requester
    email: requester@example.com
    password: Password123!
  - id: agent
    email: agent@example.com
    password: Password123!
actions:
  - actor: requester
    action: create_case
    saveAs: caseId
    params:
      title: "[sim-dup-approval-req] Duplicate approval request"
      categoryCode: wallet
      subcategoryCode: duplicate_credit
  - actor: agent
    action: claim_case
    params: { caseId: $caseId }
  - actor: agent
    action: acknowledge_case
    params: { caseId: $caseId }
  - actor: agent
    action: start_review
    params: { caseId: $caseId }
  - actor: agent
    action: request_approval
    params: { caseId: $caseId }
  - actor: agent
    action: request_approval
    expectError: true
    params: { caseId: $caseId }
assertions:
  - type: case_status
    actor: agent
    params: { caseId: $caseId, status: PENDING_APPROVAL }
cleanup:
  caseTitlePrefix: "[sim-dup-approval-req]"

name: Dead-letter job
tags: [reliability, jobs]
actors:
  - id: agent
    email: agent@example.com
    password: Password123!
actions:
  - actor: agent
    action: enqueue_test_job
    saveAs: jobId
    params:
      jobType: jobs.fail_once
      maxAttempts: 2
      payload: { succeedAfterAttempt: 99 }
      idempotencyKey: sim-job-dlq-1
  - actor: agent
    action: drain_jobs
    params: { limit: 10 }
  - actor: agent
    action: drain_jobs
    params: { limit: 10 }
  - actor: agent
    action: drain_jobs
    params: { limit: 10 }
assertions:
  - type: job_status
    actor: agent
    params: { jobId: $jobId, status: dead_letter, minAttempts: 2 }

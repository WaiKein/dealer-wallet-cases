name: Valid delegated approval
description: Team lead approves via active delegation from approver
tags: [approvals, delegation, phase9]
actors:
  - id: requester
    email: requester@example.com
    password: Password123!
  - id: agent
    email: agent@example.com
    password: Password123!
  - id: approver
    email: approver@example.com
    password: Password123!
  - id: teamlead
    email: teamlead@example.com
    password: Password123!
setup:
  titlePrefix: "[sim-p9-del]"
actions:
  - actor: approver
    action: deactivate_my_delegations
  - actor: approver
    action: create_delegation
    saveAs: delegationId
    params:
      delegate_id: "44444444-4444-4444-4444-444444444444"
      approval_limit: 50000
      change_reason: Phase 9 valid delegation
  - actor: requester
    action: create_case
    saveAs: caseId
    params:
      title: "[sim-p9-del] Delegated approval"
      categoryCode: wallet
      subcategoryCode: duplicate_credit
      priority: medium
      adjustment_amount: 250
  - actor: agent
    action: claim_case
    params: { caseId: $caseId }
  - actor: agent
    action: acknowledge_case
    params: { caseId: $caseId }
  - actor: agent
    action: start_review
    params: { caseId: $caseId }
  - actor: agent
    action: request_approval
    params: { caseId: $caseId }
  - actor: teamlead
    action: approve_case
    params: { caseId: $caseId }
  - actor: approver
    action: create_delegation
    params:
      id: $delegationId
      delegate_id: "44444444-4444-4444-4444-444444444444"
      approval_limit: 50000
      is_active: false
      change_reason: Phase 9 deactivate after valid delegation test
assertions:
  - type: case_status
    actor: agent
    params: { caseId: $caseId, status: APPROVED }
  - type: complete_audit_trail
    actor: agent
    params:
      caseId: $caseId
      eventTypes: [status_change]
cleanup:
  caseTitlePrefix: "[sim-p9-del]"

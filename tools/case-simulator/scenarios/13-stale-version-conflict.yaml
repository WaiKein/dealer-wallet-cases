id: SIM-013
runbookRefs:
  - RB-CASE-STALE-VERSION
name: Stale version conflict
tags: [reliability]
actors:
  - id: requester
    email: requester@example.com
    password: Password123!
  - id: agent
    email: agent@example.com
    password: Password123!
actions:
  - actor: requester
    action: create_case
    saveAs: caseId
    params:
      title: "[sim-stale-version] Stale version conflict"
      categoryCode: wallet
      subcategoryCode: duplicate_credit
  - actor: agent
    action: claim_case
    params: { caseId: $caseId }
  - actor: agent
    action: acknowledge_case
    params: { caseId: $caseId }
  - actor: agent
    action: start_review
    params: { caseId: $caseId }
  - actor: agent
    action: request_approval
    expectError: true
    params:
      caseId: $caseId
      expectedVersion: 999
assertions:
  - type: case_status
    actor: agent
    params: { caseId: $caseId, status: UNDER_REVIEW }
cleanup:
  caseTitlePrefix: "[sim-stale-version]"

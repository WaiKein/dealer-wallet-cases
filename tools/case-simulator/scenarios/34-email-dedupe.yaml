name: Duplicate email suppression
description: Repeated notification dispatch does not create extra DELIVERED outbox rows
tags: [email, notifications, phase9]
actors:
  - id: admin
    email: admin@example.com
    password: Password123!
  - id: requester
    email: requester@example.com
    password: Password123!
  - id: agent
    email: agent@example.com
    password: Password123!
  - id: approver
    email: approver@example.com
    password: Password123!
setup:
  titlePrefix: "[sim-p9-eded]"
actions:
  - actor: admin
    action: set_feature_flag
    params:
      code: email_notifications_enabled
      isEnabled: true
  - actor: requester
    action: create_case
    saveAs: caseId
    params:
      title: "[sim-p9-eded] Email dedupe"
      categoryCode: wallet
      subcategoryCode: duplicate_credit
      priority: medium
  - actor: agent
    action: claim_case
    params: { caseId: $caseId }
  - actor: agent
    action: acknowledge_case
    params: { caseId: $caseId }
  - actor: agent
    action: start_review
    params: { caseId: $caseId }
  - actor: agent
    action: request_approval
    params: { caseId: $caseId }
  - actor: agent
    action: run_notification_worker
    params: { limit: 30 }
  - actor: agent
    action: run_notification_worker
    params: { limit: 30 }
  - actor: agent
    action: generate_email_notification
    params: { limit: 30 }
  - actor: admin
    action: set_feature_flag
    params:
      code: email_notifications_enabled
      isEnabled: false
assertions:
  - type: email_outbox_entry
    actor: admin
    params:
      caseId: $caseId
      eventType: approval_requested
      status: DELIVERED
  - type: email_dedupe
    actor: admin
    params:
      caseId: $caseId
      eventType: approval_requested
      maxDelivered: 1
cleanup:
  caseTitlePrefix: "[sim-p9-eded]"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:runbook-sync
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase and validate migrations
        run: |
          supabase db start
          supabase db reset --yes
          test -f supabase/migrations/20260101000008_reliability_pilot.sql
          test -f supabase/migrations/20260101000009_admin_role.sql
          test -f supabase/migrations/20260101000010_admin_console.sql
          test -f supabase/migrations/20260101000011_admin_console_seed.sql
          test -f supabase/migrations/20260101000012_approval_runtime.sql
          test -f supabase/migrations/20260101000022_security_fixes.sql
          test -f supabase/migrations/20260101000023_security_hardening_followup.sql
          test -f supabase/migrations/20260101000024_idempotency_claim_token.sql
          test -f supabase/migrations/20260101000025_approval_service_role_grants.sql
          test -f supabase/migrations/20260101000026_repair_seed_pending_approvals.sql
          supabase migration list --local

  simulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [quality, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start Supabase
        run: |
          supabase start
          supabase db reset --yes
      - name: Write env
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          ENABLE_TEST_CONTROL=true
          TEST_CONTROL_SECRET=local-simulator-secret
          JOBS_TICK_SECRET=local-simulator-secret
          SIMULATOR_BASE_URL=http://127.0.0.1:3000
          EOF
          KEY=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')
          if [ -n "$KEY" ]; then
            sed -i "s|^SUPABASE_SERVICE_ROLE_KEY=.*|SUPABASE_SERVICE_ROLE_KEY=$KEY|" .env.local
          fi
      - name: Start app
        run: |
          npm run dev > /tmp/next-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start"; cat /tmp/next-dev.log; exit 1
      - name: Simulator smoke
        run: npm run simulate:smoke
        env:
          SIMULATOR_BASE_URL: http://127.0.0.1:3000
          TEST_CONTROL_SECRET: local-simulator-secret
      - name: Simulator reliability
        run: npm run simulate:reliability
        env:
          SIMULATOR_BASE_URL: http://127.0.0.1:3000
          TEST_CONTROL_SECRET: local-simulator-secret
